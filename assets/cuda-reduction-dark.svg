<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="550" y="43" fill="#e4e8f0" font-size="24" font-weight="bold">Parallel reduction across shifts</text>
<text x="550" y="76" fill="#9ba6b9" font-size="17">Illustration with 8 contributions · each node stores (weighted pixel, weight)</text>
<g stroke="#56647f" stroke-width="2" fill="none">
