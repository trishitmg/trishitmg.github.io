<g fill="#111b2e" font-size="17"><text x="87" y="137">(u₀, z₀)</text><text x="216" y="137">(u₁, z₁)</text><text x="345" y="137">(u₂, z₂)</text><text x="474" y="137">(u₃, z₃)</text><text x="603" y="137">(u₄, z₄)</text><text x="732" y="137">(u₅, z₅)</text><text x="861" y="137">(u₆, z₆)</text><text x="990" y="137">(u₇, z₇)</text><text x="151" y="244">sum pair</text><text x="409" y="244">sum pair</text><text x="667" y="244">sum pair</text><text x="925" y="244">sum pair</text><text x="280" y="350">sum pair</text><text x="796" y="350">sum pair</text></g>
