<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc">
<title id="title">Parallel tree reduction of kernel aggregation contributions</title><desc id="desc">Eight illustrative per-shift pairs, consisting of weighted pixel contribution and weight, reduce in parallel into four pairs, then two pairs, then final numerator U and degree Z. The output is U divided by Z.</desc>
